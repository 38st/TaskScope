name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode26:
    name: Xcode 26 verification
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "$zero_sha" ]]; then
            git diff --check "$PUSH_BEFORE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Validate shell syntax
        run: bash -n script/*.sh

      - name: Build debug with warnings as errors
        run: swift build -c debug -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test

      - name: Run tests with code coverage
        run: swift test --enable-code-coverage

      - name: Audit strict concurrency
        run: >-
          swift test
          --scratch-path "$RUNNER_TEMP/taskscope-strict"
          -Xswiftc -warnings-as-errors
          -Xswiftc -warn-concurrency
          -Xswiftc -enable-actor-data-race-checks

      - name: Build release
        run: swift build -c release

      - name: Stage, verify, and transaction-test bundle
        env:
          TASKSCOPE_CODE_SIGN_IDENTITY: "-"
        run: ./script/test_packaging.sh

  macos14:
    name: macOS 14 build compatibility
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate shell syntax
        run: bash -n script/*.sh

      - name: Build debug with warnings as errors
        run: swift build -c debug -Xswiftc -warnings-as-errors

      - name: Build release
        run: swift build -c release

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - xcode26
      - macos14
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI job to pass
        env:
          XCODE26_RESULT: ${{ needs.xcode26.result }}
          MACOS14_RESULT: ${{ needs.macos14.result }}
        run: |
          test "$XCODE26_RESULT" = success
          test "$MACOS14_RESULT" = success
