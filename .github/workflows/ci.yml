name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS 14 build, test, and package
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          sw_vers
          swift --version

      - name: Validate shell syntax
        run: bash -n script/*.sh

      - name: Build debug with warnings as errors
        run: swift build -c debug -Xswiftc -warnings-as-errors

      - name: Build release
        run: swift build -c release

      - name: Generate and validate app icon
        run: |
          icon_path="$RUNNER_TEMP/TaskScope.icns"
          swift script/render_icon.swift "$icon_path"
          test -s "$icon_path"
          file "$icon_path" | grep -q "Mac OS X icon"

      - name: Stage, verify, and transaction-test bundle
        run: script/test_packaging.sh

  strict-concurrency:
    name: Swift 6 tests and strict concurrency
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          sw_vers
          swift --version

      - name: Test with code coverage
        run: swift test --enable-code-coverage

      - name: Report code coverage
        run: |
          coverage_path="$(swift test --show-codecov-path)"
          test -s "$coverage_path"
          cp "$coverage_path" taskscope-coverage.json
          line_percent="$(jq -r '.data[0].totals.lines.percent' "$coverage_path")"
          region_percent="$(jq -r '.data[0].totals.regions.percent' "$coverage_path")"
          {
            echo "## TaskScope coverage"
            echo
            echo "- Lines: ${line_percent}%"
            echo "- Regions: ${region_percent}%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: taskscope-coverage
          path: taskscope-coverage.json
          retention-days: 7

      - name: Audit strict concurrency
        run: >-
          swift test
          --scratch-path .build/strict-concurrency
          -Xswiftc -warnings-as-errors
          -Xswiftc -warn-concurrency
          -Xswiftc -enable-actor-data-race-checks
