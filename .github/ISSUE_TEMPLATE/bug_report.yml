name: Bug report
description: Report a reproducible TaskScope defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove private process names, command lines, paths, and organization details before submitting.
        For suspected vulnerabilities, use [private reporting](https://github.com/38st/TaskScope/security/advisories/new) instead of this public form.
        See [Support](https://github.com/38st/TaskScope/blob/main/SUPPORT.md) for recovery steps and redacted diagnostics.
  - type: input
    id: version
    attributes:
      label: TaskScope version and build
      description: Copy the exact version and build shown in About TaskScope.
      placeholder: Copy the value shown in About TaskScope
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Installation source
      description: How was this copy of TaskScope installed?
      options:
        - Built from source (swift build)
        - Local development package (script/build_and_run.sh or script/install.sh)
        - Other or unknown
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.7"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots if useful. Do not include secrets or private process data.
